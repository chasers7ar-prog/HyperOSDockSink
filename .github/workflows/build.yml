name: Build Module

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android NDK
        run: |
          cd $HOME
          curl -L -o ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q ndk.zip
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r27c" >> $GITHUB_ENV
          ls $HOME/android-ndk-r27c/build/cmake/

      - name: Build native library
        run: |
          echo "Using NDK: $ANDROID_NDK_HOME"
          cd native
          mkdir -p build && cd build
          cmake \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-35 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            ..
          cmake --build . --verbose -j$(nproc)
          test -f libdock_sink.so || (echo "Build failed: so not found" && ls -la && exit 1)
          ls -lh libdock_sink.so

      - name: Package module
        run: |
          mkdir -p out/lib/arm64-v8a
          cp native/build/libdock_sink.so out/lib/arm64-v8a/
          cp module.prop out/
          cp zn_modules.txt out/
          [ -f config.prop.example ] && cp config.prop.example out/ || true

          mkdir -p out/META-INF/com/google/android
          echo "#MAGISK" > out/META-INF/com/google/android/updater-script

          cat > out/META-INF/com/google/android/update-binary << 'SCRIPT'
#!/sbin/sh
OUTFD=${2:-1}
ZIPFILE=$3
ui_print() { echo "ui_print $1" > /proc/self/fd/$OUTFD; echo "ui_print" > /proc/self/fd/$OUTFD; }
ui_print "- HyperOSDockSink installing..."
MODDIR=/data/adb/modules/HyperOSDockSink
mkdir -p "$MODDIR"
unzip -o "$ZIPFILE" -d "$MODDIR"
chmod 755 "$MODDIR/lib/arm64-v8a/libdock_sink.so" 2>/dev/null || true
ui_print "- Done. Please reboot."
SCRIPT
          chmod +x out/META-INF/com/google/android/update-binary

          cd out
          zip -r9 ../HyperOSDockSink.zip .
          ls -lh ../HyperOSDockSink.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperOSDockSink-module
          path: HyperOSDockSink.zip
          if-no-files-found: error

name: Build Module

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Build native library
        run: |
          cd native
          mkdir -p build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-35 \
                -DCMAKE_BUILD_TYPE=Release \
                ..
          cmake --build . -j$(nproc)
          ls -l

      - name: Prepare Magisk / Zygisk Next module
        run: |
          mkdir -p out/lib/arm64-v8a
          cp native/build/libdock_sink.so out/lib/arm64-v8a/
          cp module.prop zn_modules.txt out/
          cp config.prop.example out/

          mkdir -p out/META-INF/com/google/android
          # Magisk module marker
          echo "#MAGISK" > out/META-INF/com/google/android/updater-script

          # Minimal but functional update-binary
          cat > out/META-INF/com/google/android/update-binary << 'EOF'
#!/sbin/sh

OUTFD=$2
ZIPFILE=$3

ui_print() {
  echo "ui_print $1" > /proc/self/fd/$OUTFD
  echo "ui_print" > /proc/self/fd/$OUTFD
}

ui_print "- HyperOSDockSink installing..."

# Magisk / KernelSU / APatch module path
MODDIR=/data/adb/modules/HyperOSDockSink
mkdir -p $MODDIR

unzip -o "$ZIPFILE" -d $MODDIR >&2

# Ensure permissions
chmod 755 $MODDIR/lib/arm64-v8a/libdock_sink.so 2>/dev/null || true

ui_print "- Done. Reboot required."
ui_print "- Edit /data/adb/modules/HyperOSDockSink/config.prop if needed"
EOF
          chmod +x out/META-INF/com/google/android/update-binary

      - name: Pack zip
        run: |
          cd out
          zip -r9 ../HyperOSDockSink-v1.0.0.zip .
          ls -lh ../HyperOSDockSink-v1.0.0.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperOSDockSink-module
          path: HyperOSDockSink-v1.0.0.zip

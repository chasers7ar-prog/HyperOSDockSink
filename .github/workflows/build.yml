name: Build Module

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android NDK
        run: |
          cd $HOME
          curl -L -o ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q ndk.zip
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r27c" >> $GITHUB_ENV
          ls $HOME/android-ndk-r27c/build/cmake/

      - name: Build native library
        run: |
          echo "Using NDK: $ANDROID_NDK_HOME"
          cd native
          mkdir -p build && cd build
          cmake \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-35 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            ..
          cmake --build . -j$(nproc)
          test -f libdock_sink.so || (echo "SO not found" && ls -la && exit 1)
          ls -lh libdock_sink.so

      - name: Package module zip
        run: |
          # Standard Magisk/KSU module layout (all at zip root)
          mkdir -p package/lib/arm64-v8a
          mkdir -p package/META-INF/com/google/android

          cp native/build/libdock_sink.so package/lib/arm64-v8a/
          cp module.prop package/
          cp zn_modules.txt package/
          cp META-INF/com/google/android/update-binary package/META-INF/com/google/android/
          cp META-INF/com/google/android/updater-script package/META-INF/com/google/android/
          if [ -f config.prop.example ]; then cp config.prop.example package/; fi

          chmod 755 package/META-INF/com/google/android/update-binary
          chmod 755 package/lib/arm64-v8a/libdock_sink.so

          # Verify required files exist
          test -f package/module.prop
          test -f package/zn_modules.txt
          test -f package/lib/arm64-v8a/libdock_sink.so
          test -f package/META-INF/com/google/android/update-binary

          cd package
          zip -r9 ../HyperOSDockSink.zip .
          echo "=== Zip contents ==="
          unzip -l ../HyperOSDockSink.zip
          ls -lh ../HyperOSDockSink.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperOSDockSink-module
          path: HyperOSDockSink.zip
          if-no-files-found: error

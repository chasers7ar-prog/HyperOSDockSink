name: Build Module

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android NDK
        run: |
          cd $HOME
          curl -L -o ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q ndk.zip
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r27c" >> $GITHUB_ENV

      - name: Build native library
        run: |
          cd native
          mkdir -p build && cd build
          cmake \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-35 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            ..
          cmake --build . -j$(nproc)
          test -f libdock_sink.so
          ls -lh libdock_sink.so

      - name: Package module
        run: |
          rm -rf package HyperOSDockSink.zip
          mkdir -p package/lib/arm64-v8a
          mkdir -p package/META-INF/com/google/android

          cp native/build/libdock_sink.so package/lib/arm64-v8a/
          cp module.prop package/
          cp zn_modules.txt package/
          cp customize.sh package/
          cp META-INF/com/google/android/update-binary package/META-INF/com/google/android/
          echo "#MAGISK" > package/META-INF/com/google/android/updater-script
          [ -f config.prop.example ] && cp config.prop.example package/

          chmod 755 package/META-INF/com/google/android/update-binary
          chmod 755 package/customize.sh
          chmod 755 package/lib/arm64-v8a/libdock_sink.so

          # Must be zip root = module root (no outer folder)
          cd package
          zip -r9 ../HyperOSDockSink.zip .
          cd ..

          echo "======== ZIP LIST ========"
          unzip -l HyperOSDockSink.zip
          echo "=========================="

          # Hard checks
          unzip -l HyperOSDockSink.zip | grep -q "module.prop"
          unzip -l HyperOSDockSink.zip | grep -q "zn_modules.txt"
          unzip -l HyperOSDockSink.zip | grep -q "lib/arm64-v8a/libdock_sink.so"
          unzip -l HyperOSDockSink.zip | grep -q "META-INF/com/google/android/update-binary"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperOSDockSink-module
          path: HyperOSDockSink.zip

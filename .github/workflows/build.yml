name: Build Module

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK via sdkmanager
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          ls -la $ANDROID_HOME/ndk/

      - name: Build native library
        run: |
          export ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.0.12077973
          echo "NDK path: $ANDROID_NDK_HOME"
          ls "$ANDROID_NDK_HOME/build/cmake/"
          cd native
          mkdir -p build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-35 \
                -DANDROID_STL=c++_static \
                -DCMAKE_BUILD_TYPE=Release \
                ..
          cmake --build . -j$(nproc)
          ls -l

      - name: Prepare Magisk / Zygisk Next module
        run: |
          mkdir -p out/lib/arm64-v8a
          cp native/build/libdock_sink.so out/lib/arm64-v8a/
          cp module.prop zn_modules.txt out/
          cp config.prop.example out/ 2>/dev/null || true

          mkdir -p out/META-INF/com/google/android
          echo "#MAGISK" > out/META-INF/com/google/android/updater-script

          cat > out/META-INF/com/google/android/update-binary << 'EOF'
#!/sbin/sh

OUTFD=$2
ZIPFILE=$3

ui_print() {
  echo "ui_print $1" > /proc/self/fd/$OUTFD
  echo "ui_print" > /proc/self/fd/$OUTFD
}

ui_print "- HyperOSDockSink installing..."

MODDIR=/data/adb/modules/HyperOSDockSink
mkdir -p $MODDIR

unzip -o "$ZIPFILE" -d $MODDIR >&2

chmod 755 $MODDIR/lib/arm64-v8a/libdock_sink.so 2>/dev/null || true

ui_print "- Done. Reboot required."
ui_print "- Edit config.prop if needed"
EOF
          chmod +x out/META-INF/com/google/android/update-binary

      - name: Pack zip
        run: |
          cd out
          zip -r9 ../HyperOSDockSink-v1.0.0.zip .
          ls -lh ../HyperOSDockSink-v1.0.0.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperOSDockSink-module
          path: HyperOSDockSink-v1.0.0.zip
